<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household COO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Household COO">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Jost,sans-serif;background:var(--bg2);color:var(--ink);font-size:16px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--navy);margin:0}
h1{font-size:44px;line-height:1.05}h2{font-size:28px}
button,input,select,textarea{font-family:inherit;font-size:16px}
.btn{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
input,select,textarea{min-height:46px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{padding:12px 14px;min-height:80px}
label{font-size:14px;color:var(--mute);display:block;margin:12px 0 6px}
.card{background:#fff;border:1px solid #e6dba9;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(20,48,92,.08)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
.rule{width:72px;height:3px;background:var(--gold);margin:10px 0 14px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.center .card{max-width:440px;width:100%}
#app{display:flex;min-height:100vh}
#side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,var(--side-top),var(--side-bot));border-right:3px solid var(--gold);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
#side .brand{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1;margin:6px 8px 0}
#side .by{font-size:11px;letter-spacing:.16em;color:var(--gold-l);margin:6px 8px 22px}
#side a{display:block;padding:12px 14px;border-radius:12px;color:#fff;cursor:pointer;font-weight:500}
#side a.on{background:var(--gold);color:#10203d;font-weight:600}
#me{margin-top:auto;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px;font-size:13px}
#main{flex:1;padding:36px 44px;max-width:1100px}
#main.k{padding:0;max-width:none}
#kframe{width:100%;height:calc(100vh - 56px);border:0;display:block}
#mframe{width:100%;height:100vh;border:0;display:block}
#ksub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);min-height:56px}
#ksub a{padding:7px 15px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;color:var(--blue);border:1px solid var(--line);background:#fff}
#ksub a.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--track)}
.row:first-child{border-top:0}
.chk{flex:0 0 28px;width:28px;height:28px;border-radius:8px;border:2px solid var(--blue);background:#fff;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chk.done{background:var(--blue)}
.done-t{text-decoration:line-through;color:var(--mute)}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.chip{display:inline-block;background:#E7ECF5;color:var(--blue);font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;margin-left:6px}
.soon{border:2px dashed var(--line);background:transparent;box-shadow:none}
.err{color:var(--red);font-size:14px;margin-top:10px}
@media(max-width:760px){
  #app{flex-direction:column}
  #side{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;padding:10px;border-right:0;border-bottom:3px solid var(--gold)}
  #side .brand,#side .by,#me{display:none}
  #side a{padding:10px 12px}
  #main{padding:22px 16px}#main.k{padding:0}#kframe{height:calc(100vh - 176px)}#mframe{height:calc(100vh - 120px)}h1{font-size:36px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=2"></script>
<script src="calendar.js?v=10"></script>
<script src="kidmoney.js?v=1"></script>
<script src="people.js?v=3"></script>
<script src="receipts.js?v=2"></script>
<script src="paywall.js?v=1"></script>
<script src="tv.js?v=5"></script>
<script src="chores.js?v=1"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=supabase.createClient(COO_CONFIG.SUPABASE_URL,COO_CONFIG.SUPABASE_PUBLISHABLE_KEY);
let S={user:null,hh:null,me:null,members:[],tasks:[],page:'home',kdata:null};
// A person who opened their invitation email arrives signed in, with no password yet. They choose one first.
let INVITE=/type=invite/.test(location.hash);

// ---------- screens ----------
function friendly(e){
const m=String((e&&e.message)||e||'').toLowerCase();
if(m.includes('invalid login'))return 'That email or password is not right. Try again, or tap Forgot password.';
if(m.includes('already registered')||m.includes('already been registered'))return 'That email already has an account. Tap Sign in instead.';
if(m.includes('password')&&(m.includes('characters')||m.includes('weak')||m.includes('short')))return 'Your password needs at least 8 characters.';
if(m.includes('rate limit')||m.includes('too many')||m.includes('seconds'))return 'Too many tries. Wait a few minutes and try again.';
if(m.includes('not confirmed'))return 'Please confirm your email first. Check your inbox.';
if(m.includes('valid email')||m.includes('invalid email'))return 'That email does not look right. Check it and try again.';
if(m.includes('fetch')||m.includes('network'))return 'No connection. Check your internet and try again.';
return 'Something went wrong. Please try again.';
}
function signIn(msg,mode){
mode=mode||'in';
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
const up=mode==='up', fg=mode==='forgot';
const head=up?'Create your account.':(fg?'Reset your password.':'Welcome.');
const sub=up?'Use your email and pick a password with at least 8 characters.':(fg?'Type your email. We send you an email to choose a new password.':'Sign in with your email and password. If a parent added you, use the email and password they gave you. Do not create an account.');
$('#root').innerHTML='<div class="center"><div class="card">'
+'<div class="eyebrow">Household COO · by Provision House</div><h1>'+head+'</h1><div class="rule"></div>'
+'<p style="color:var(--mute)">'+sub+'</p>'
+'<label for="em">Email</label><input id="em" type="email" autocomplete="'+(up?'off':'email')+'">'
+(fg?'':'<label for="pw">Password</label><input id="pw" type="password" autocomplete="'+(up?'new-password':'current-password')+'">')
+'<div style="margin-top:16px"><button class="btn" id="go">'+(up?'Create account':(fg?'Send reset email':'Sign in'))+'</button></div>'
+'<div class="err" id="msg">'+esc(msg||'')+'</div>'
+'<div style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px">'
+(up||fg?'<a href="#" id="s-in" style="color:var(--blue)">Back to sign in</a>':'<a href="#" id="s-up" style="color:var(--blue)">Create an account</a><a href="#" id="s-fg" style="color:var(--blue)">Forgot password</a>')
+'</div></div></div>';
const say=(t,good)=>{$('#msg').style.color=good?'var(--blue)':'';$('#msg').textContent=t};
const sw=(id,m)=>{const a=document.getElementById(id);if(a)a.onclick=ev=>{ev.preventDefault();signIn('',m)}};
sw('s-in','in');sw('s-up','up');sw('s-fg','forgot');
const submit=async()=>{
const email=$('#em').value.trim(), pw=$('#pw')?$('#pw').value:'';
if(!email){say('Type your email.');return}
if(!fg&&!pw){say('Type your password.');return}
if(up&&pw.length<8){say('Your password needs at least 8 characters.');return}
$('#go').disabled=true;
try{
if(fg){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;say('If that email has an account, a reset email is on its way.',true)}
else if(up){const {data,error}=await sb.auth.signUp({email,password:pw});if(error)throw error;if(!data.session){const r=await sb.auth.signInWithPassword({email,password:pw});if(r.error){say('Almost done. Open your email and confirm your address, then sign in.',true)}}}
else{const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error}
}catch(e){say(friendly(e))}
$('#go').disabled=false;
};
$('#go').onclick=submit;
['em','pw'].forEach(id=>{const el=document.getElementById(id);if(el)el.onkeydown=ev=>{if(ev.key==='Enter')submit()}});
}
function newPassword(first){
$('#root').innerHTML='<div class="center"><div class="card">'
+'<div class="eyebrow">Household COO · by Provision House</div><h1>'+(first?'Choose your password.':'Choose a new password.')+'</h1><div class="rule"></div>'
+'<label for="np">New password (at least 8 characters)</label><input id="np" type="password" autocomplete="new-password">'
+'<div style="margin-top:16px"><button class="btn" id="go">Save password</button></div><div class="err" id="msg"></div></div></div>';
$('#go').onclick=async()=>{
const p=$('#np').value;
if(p.length<8){$('#msg').textContent='Your password needs at least 8 characters.';return}
$('#go').disabled=true;
const {error}=await sb.auth.updateUser({password:p});
if(error){$('#msg').textContent=friendly(error);$('#go').disabled=false;return}
history.replaceState(null,'',location.pathname+location.search);
INVITE=false;
load();
};
}
function createHousehold(){
  $('#root').innerHTML=`<div class="center"><div class="card">
  <div class="eyebrow">First time here</div><h1>Name your household.</h1><div class="rule"></div>
  <label for="hn">Household name</label><input id="hn" placeholder="The Smith Household">
  <label for="yn">Your name</label><input id="yn" placeholder="First name" autocomplete="off" name="hh_your_name">
  <div style="margin-top:16px"><button class="btn" id="mk">Create it</button></div><div class="err" id="msg"></div></div></div>`;
  $('#mk').onclick=async()=>{
    if($('#mk').disabled)return;$('#mk').disabled=true;
    const h_name=$('#hn').value.trim()||'My Household';
    const {error}=await sb.rpc('create_household',{h_name});
    if(error){$('#msg').textContent=error.message;$('#mk').disabled=false;return}
    await sb.rpc('set_my_name',{n:$('#yn').value.trim()||'Owner'});
    load();
  };
}

// ---------- data ----------
const isManager=()=>S.me&&['owner','adult'].includes(S.me.role);
const seesMoney=()=>S.me&&(S.me.can_see_money||(typeof isAdultMember==='function'&&isAdultMember()));
// Adult household members keep their own private money. It is stored under their own sign-in, not the household's.
const privateMoney=()=>S.me&&!S.me.can_see_money&&typeof isAdultMember==='function'&&isAdultMember();
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){signIn();return}
  S.user=session.user;
  if(INVITE){newPassword(true);return}
  try{await sb.rpc('claim_invites')}catch(e){console.warn(e)}
  const {data:mem,error}=await sb.from('household_members').select('*').eq('user_id',S.user.id);
  if(error){signIn(friendly(error));return}
  if(!mem.length){createHousehold();return}
  S.me=mem[0];
  if(mem.length>1){const {data:cnt}=await sb.from('household_members').select('household_id').in('household_id',mem.map(x=>x.household_id));const c={};(cnt||[]).forEach(x=>{c[x.household_id]=(c[x.household_id]||0)+1});mem.sort((a,b)=>(c[b.household_id]||0)-(c[a.household_id]||0)||String(a.created_at).localeCompare(String(b.created_at)));S.me=mem[0];}
  const {data:hh}=await sb.from('households').select('*').eq('id',S.me.household_id).single();
  S.hh=hh;
  const {data:all}=await sb.from('household_members').select('*').eq('household_id',S.me.household_id);
  S.members=all||[];
  await loadSub();if(!subOk()){paywall();return}
  await loadTasks();
  await loadKitchen();
  try{await loadTypes()}catch(e){console.warn(e)}
  await loadMoney();
  try{await loadCal()}catch(e){console.warn(e)}
if(S.cal&&S.cal.tv&&S.cal.tv[S.user.id]&&!isManager()&&typeof tvStart==='function'){S.tvLocked=true;tvStart();return}
  if(!S.me.display_name){const n=prompt('What name should the household see for you?');if(n){await sb.rpc('set_my_name',{n});S.me.display_name=n;const i=S.members.findIndex(x=>x.user_id===S.user.id);if(i>=0)S.members[i].display_name=n}}
  S.page=S.me.role==='kid'?'tasks':'cal';
  const pq=(location.search.match(/[?&]page=([a-z]+)/)||[])[1]; if(pq==='chores'){S.page='chores';history.replaceState(null,'',location.pathname);}
  if(/[?&]tv=1/.test(location.search)&&typeof tvStart==='function'){tvStart();return}
  shell();
}
async function loadKitchen(){
  const {data}=await sb.from('app_data').select('data').eq('household_id',S.me.household_id).eq('module','meal_builder').maybeSingle();
  S.kdata=data?data.data:null;
}
async function loadMoney(){
  if(!seesMoney()){S.mdata=null;return}
  if(privateMoney()){
    const {data:pm}=await sb.from('member_money').select('data').eq('user_id',S.user.id).maybeSingle();
    S.mdata=pm?pm.data:null;return;
  }
  const {data}=await sb.from('app_data').select('data').eq('household_id',S.me.household_id).eq('module','cfo').maybeSingle();
  S.mdata=data?data.data:null;
}
async function saveMoney(d){
  if(!seesMoney())return;
  S.mdata=d;
  if(privateMoney()){
    const {error:pe}=await sb.from('member_money').upsert({user_id:S.user.id,household_id:S.me.household_id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(pe)console.warn('money save failed',pe.message);
    return;
  }
  const {error}=await sb.from('app_data').upsert({household_id:S.me.household_id,module:'cfo',data:d,updated_at:new Date().toISOString()},{onConflict:'household_id,module'});
  if(error)console.warn('money save failed',error.message);
}
let _ksave=null;
async function saveKitchen(d){
  S.kdata=d;
  const {error}=await sb.from('app_data').upsert({household_id:S.me.household_id,module:'meal_builder',data:d,updated_at:new Date().toISOString()},{onConflict:'household_id,module'});
  if(error)console.warn('kitchen save failed',error.message);
}
window.addEventListener('message',e=>{
  if(e.origin!==location.origin)return;
  const m=e.data||{};
  const f=document.getElementById('kframe');
  if(m.type==='kitchen-ready'&&f&&e.source===f.contentWindow){
    try{
      const w=f.contentWindow, of=w.fetch.bind(w);
      w.fetch=async(u,o)=>{
        if(String(u).includes('/api/generate')||String(u).includes('/api/receipt')){
          const {data:{session}}=await sb.auth.getSession();
          o={...o,headers:{...(o&&o.headers),Authorization:'Bearer '+(session?session.access_token:'')}};
        }
        return of(u,o);
      };
    }catch(err){console.warn(err)}
    f.contentWindow.postMessage({type:'kitchen-init',data:S.kdata,email:S.user.email,page:S.page.slice(2),money:!!seesMoney(),spend:grocSpend()},location.origin);
  }else if(m.type==='kitchen-save'){ saveKitchen(m.data); }
  else if(m.type==='money-ready'){
    const mf=document.getElementById('mframe');
    if(mf&&e.source===mf.contentWindow&&seesMoney()){
      try{
        const w=mf.contentWindow, of=w.fetch.bind(w);
        w.fetch=async(u,o)=>{
          if(String(u).includes('/api/statement')){
            const {data:{session}}=await sb.auth.getSession();
            o={...o,headers:{...(o&&o.headers),Authorization:'Bearer '+(session?session.access_token:'')}};
          }
          return of(u,o);
        };
      }catch(err){console.warn(err)}
      mf.contentWindow.postMessage({type:'money-init',data:S.mdata,sub:privateMoney()?null:S.sub},location.origin);
    }
  }else if(m.type==='receipt-spend'){
    if(seesMoney()&&S.mdata){
      S.mdata.groceryReceipts=(S.mdata.groceryReceipts||[]).concat([{date:String(m.date||'').slice(0,10),store:String(m.store||'').slice(0,60),total:+m.total||0}]).slice(-200);
      saveMoney(S.mdata);
      const kf=document.getElementById('kframe'); if(kf&&kf.contentWindow)kf.contentWindow.postMessage({type:'kitchen-spend',spend:grocSpend()},location.origin);
    }
  }
  else if(m.type==='money-save'){ if(S.mdata&&S.mdata.groceryReceipts&&m.data&&!m.data.groceryReceipts)m.data.groceryReceipts=S.mdata.groceryReceipts; if(S.mdata&&S.mdata.receipts&&m.data&&!m.data.receipts)m.data.receipts=S.mdata.receipts; saveMoney(m.data); }
});
function grocSpend(){
  if(!seesMoney()||!S.mdata)return null;
  const n=new Date(),ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  const l=(S.mdata.groceryReceipts||[]).filter(r=>String(r.date).slice(0,7)===ym);
  return {total:l.reduce((t,r)=>t+(+r.total||0),0),count:l.length};
}
async function loadTasks(){
  const {data}=await sb.from('tasks').select('*').eq('household_id',S.me.household_id).order('created_at',{ascending:true});
  S.tasks=data||[];
}

// ---------- shell ----------
function navItems(){
  const kid=S.me.role==='kid', staff=['helper','staff'].includes(S.me.role);
  if(kid||staff){
    const mine=kid?(privateMoney()?[['money','Money'],['receipts','Receipts'],['add','Add what I need'],['dinner','Dinner']]:[['km','My money'],['add','Add what I need'],['dinner','Dinner']]):[];
    return [['chores','Chores'],['tasks','My tasks'],['cal','Command Center']].concat(mine);
  }
  const n=[['cal','Command Center'],['chores','Chores'],['k:dashboard','Kitchen']];
    if(seesMoney()){n.push(['money','Money']);n.push(['receipts','Receipts']);}
  n.push(['people','People']);
  return n;
}
function shell(){
  $('#root').innerHTML=`<div id="app"><nav id="side"><div class="brand">Household<br>COO</div><div class="by">BY PROVISION HOUSE</div>
  ${navItems().map(([k,l])=>`<a data-p="${k}" class="${(S.page===k||(k==='k:dashboard'&&S.page.startsWith('k:')))?'on':''}">${l}</a>`).join('')}
  <div id="me"><b>${esc(S.hh?.name)}</b><br>${esc(privateMoney()?'adult member':S.me.role)}${privateMoney()?' · private money':(seesMoney()?' · sees money':'')}<br><a id="out" style="padding:6px 0 0;color:var(--gold-l);font-size:13px">Sign out</a></div></nav>
  <main id="main"></main></div>`;
  document.querySelectorAll('#side a[data-p]').forEach(a=>a.onclick=()=>{
    const to=a.dataset.p;
    S.page=to;shell();
  });
  $('#out').onclick=async()=>{await sb.auth.signOut();S.user=null;signIn()};
  render();
}
function render(){
  const m=$('#main');
  m.classList.toggle('k',S.page.startsWith('k:')||(S.page==='money'&&seesMoney()));
  if(S.page.startsWith('k:')){
    const tabs=[['guide','How To'],['dashboard','Overview'],['inventory','Inventory'],['pantry','Staples'],['builder','Meal Builder'],['favorites','Favorites'],['calendar','Meal calendar'],['grocery','Grocery list'],['settings','Settings']];
    m.innerHTML='<div id="ksub">'+tabs.map(([k,l])=>`<a data-k="${k}" class="${S.page==='k:'+k?'on':''}">${l}</a>`).join('')+'</div><iframe id="kframe" src="kitchen.html?v='+Date.now()+'" title="Kitchen"></iframe>';
    document.querySelectorAll('#ksub a').forEach(a=>a.onclick=()=>{
      const f=document.getElementById('kframe'); if(a.dataset.k==='settings'){if(f&&f.contentWindow)f.contentWindow.postMessage({type:'kitchen-page',page:'settings'},location.origin);return;} S.page='k:'+a.dataset.k;
      document.querySelectorAll('#ksub a').forEach(x=>x.classList.toggle('on',x===a));
      if(f&&f.contentWindow)f.contentWindow.postMessage({type:'kitchen-page',page:a.dataset.k},location.origin);
    });
  }
  else if(S.page==='money'&&seesMoney()) m.innerHTML='<iframe id="mframe" src="money.html?v='+Date.now()+'" title="Money"></iframe>';
  else if(S.page==='receipts'&&seesMoney()) m.innerHTML=receiptsView();
  else if(S.page==='chores') m.innerHTML=choresView();
  else if(S.page==='people') m.innerHTML=peopleView();
  else if(S.page==='km') m.innerHTML=kmView();
  else if(S.page==='cal'||S.page==='home') m.innerHTML='<div style="text-align:right;margin-bottom:8px"><button class="btn ghost" id="tvgo">📺 Show on TV</button></div>'+(typeof choreSummary==='function'?choreSummary():'')+calView()+openList();
  else if(S.page==='tasks'||S.page==='home') m.innerHTML=tasksView(S.page==='home');
  else if(S.page==='add') m.innerHTML=addView();
  else m.innerHTML=soon(S.page);
  bind();
}
function soon(p){
  const t={kitchen:'Kitchen',money:'Money',dinner:'Dinner'}[p]||p;
  return `<div class="eyebrow">${t}</div><h1>Coming next.</h1><div class="rule"></div>
  <div class="card soon"><p style="margin:0;color:var(--mute)">This part is not ready yet.</p></div>`;
}
const nm=id=>{const m=S.members.find(x=>x.user_id===id);return m?(m.display_name||m.role):'Member'};
function who(id){ if(!id)return 'Anyone'; return id===S.user.id?'You':nm(id) }
function tasksView(home){
  const mine=S.me.role==='kid'||['helper','staff'].includes(S.me.role);
  const list=S.tasks.filter(t=>t.kind!=='chore'); const open=list.filter(t=>t.status!=='done'), done=list.filter(t=>t.status==='done');
  const add=`<div class="card" style="margin-bottom:18px"><h2>Add a task or appointment</h2>
   <label for="tt">What needs doing, or what is the appointment</label><input id="tt">
   ${mine?'':`<label for="th">Handoff note (so whoever does it knows exactly how)</label><textarea id="th"></textarea>
   <label for="tk">Is this a task or an appointment?</label><select id="tk"><option value="task">Task</option><option value="appointment">Appointment</option></select>
   <label for="td">Date (optional)</label><input id="td" type="date">
   <label for="tt2">Time (for an appointment)</label><input id="tt2" type="time">
   <label for="ta">Who has it</label><select id="ta"><option value="">Anyone</option>${S.members.map(x=>`<option value="${x.user_id}">${x.user_id===S.user.id?'Me':esc(nm(x.user_id))+' ('+esc(x.role)+')'}</option>`).join('')}</select>`}
   <div style="margin-top:14px"><button class="btn" id="addt">Add</button></div></div>`;
  const row=t=>`<div class="row"><button class="chk ${t.status==='done'?'done':''}" data-t="${t.id}" aria-label="Mark done">${t.status==='done'?'&#10003;':''}</button>
   <div style="flex:1"><div class="${t.status==='done'?'done-t':''}" style="font-weight:600">${esc(t.title)}<span class="chip">${who(t.assigned_to)}</span>${t.kind==='appointment'?'<span class="chip" style="background:#F6EBC4">Appointment</span>':''}${t.due_date?`<span class="chip">${t.kind==='appointment'?'':'Due '}${esc(t.due_date)}${t.due_time?' '+esc(t.due_time):''}</span>`:''}</div>
   ${t.handoff_notes?`<div class="note">Note: ${esc(t.handoff_notes)}</div>`:''}</div></div>`;
  return `<div class="eyebrow">${esc(S.hh.name)}</div><h1>${home?'Home.':(mine?'My tasks.':'Tasks.')}</h1><div class="rule"></div>
  ${mine&&typeof choreSummary==='function'?choreSummary():''}${home&&typeof calToday==='function'?calToday():''}${add}<div class="card"><h2>Open · ${open.length}</h2>${open.map(row).join('')||'<p class="note">Nothing open.</p>'}
  ${done.length?`<h2 style="margin-top:18px">Done · ${done.length}</h2>${done.map(row).join('')}`:''}</div>`;
}
function openList(){ const h=tasksView(false); const i=h.indexOf('<div class="card"><h2>Open'); return i<0?'':'<div style="margin-top:18px">'+h.slice(i)+'</div>'; }
function addView(){
  return `<div class="eyebrow">Add</div><h1>What do you need?</h1><div class="rule"></div>
  <div class="card"><label for="tt">For school or the grocery list</label><input id="tt"><div style="margin-top:14px"><button class="btn" id="addt">Add</button></div></div>`;
}
function bind(){
  const a=$('#addt');
  if(a)a.onclick=async()=>{
    const title=$('#tt').value.trim(); if(!title)return;
    const kid=S.me.role==='kid';
    const row={household_id:S.me.household_id,title,handoff_notes:$('#th')?.value.trim()||null,
      assigned_to:kid?S.user.id:($('#ta')?.value||null),due_date:$('#td')?.value||null,kind:$('#tk')?.value||'task',due_time:$('#tt2')?.value||null,shared:isManager()};
    const {error}=await sb.from('tasks').insert(row);
    if(error){alert(error.message);return}
    await loadTasks();render();
  };
  document.querySelectorAll('.chk').forEach(b=>b.onclick=async()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.t);
    await sb.from('tasks').update({status:t.status==='done'?'open':'done'}).eq('id',t.id);
    await loadTasks();render();
  });
  if(typeof calBind==='function')calBind();
  if(typeof kmBind==='function')kmBind();
  if(typeof peopleBind==='function')peopleBind();
  if(typeof receiptsBind==='function')receiptsBind();
  if(typeof choresBind==='function')choresBind();
  const tvb=document.getElementById('tvgo');if(tvb)tvb.onclick=()=>tvStart();
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){newPassword();return} if(ev==='SIGNED_IN'&&!S.user)load() });
load();
</script>
</body>
</html>
